<link rel="stylesheet" href="assets/motor/hub.css">
<link rel="stylesheet" href="assets/motor/temas/dtmm.css">
<style>
.acciones-clase{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.marcar-vista{min-height:44px;padding:0 1.2rem;border-radius:999px;border:1px solid var(--line-d2);
  background:none;color:var(--on-char-soft);cursor:pointer;font:500 .7rem/1 'Martian Mono',monospace;
  letter-spacing:.1em;text-transform:uppercase}
.marcar-vista:hover{border-color:var(--accent-text);color:var(--on-char)}
.marcar-vista[aria-pressed="true"]{border-color:var(--lettuce);color:var(--lettuce)}
.marcar-vista:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
.vecinas{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:3rem}
.vecina{display:flex;flex-direction:column;gap:.35rem;padding:1rem 1.1rem;border:1px solid var(--line-d);
  border-radius:14px;text-decoration:none;color:inherit;transition:border-color .2s,background-color .2s}
.vecina:hover{border-color:var(--accent-text);background:rgba(var(--hub-panel-rgb),.5)}
.vecina.sig{text-align:right}
.vecina .r{color:var(--accent-text);font:500 .62rem/1.3 'Martian Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.vecina .t{font-family:'Unbounded',sans-serif;font-size:.9rem;line-height:1.3}
@media(max-width:640px){.vecinas{grid-template-columns:1fr}.vecina.sig{text-align:left}}
</style>
</head>
<body class="theme-dtmm">

<div class="topbar">
  <a class="brand" href="index.html">De tu mente al <b>mundo</b></a>
  <div style="flex:1"></div>
  <a class="home" href="index.html">‹ Hub</a>
</div>

<div class="detail" id="detail"></div>

<script src="assets/motor/progreso.js"></script>
<script>
(function(){
  'use strict';
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,c=>(
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const id = new URLSearchParams(location.search).get('id');
  const box = document.getElementById('detail');

  function fechaLarga(iso){
    const [a,m,d] = String(iso).split('-').map(Number);
    if(!a||!m||!d) return esc(iso);
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','septiembre','octubre','noviembre','diciembre'];
    return d+' de '+meses[m-1]+' de '+a;
  }

  // clase anterior y siguiente en el orden del curso completo
  function vecinas(clase, data){
    const todas = [];
    data.filas.forEach(f=>f.clases.forEach(c=>{ if(c.deck) todas.push({c:c,f:f}); }));
    const k = todas.findIndex(x=>x.c.id===clase.id);
    const enlace = (x, rotulo, lado)=> x ?
      '<a class="vecina '+lado+'" href="clase.html?id='+encodeURIComponent(x.c.id)+'">'+
        '<span class="r">'+rotulo+' · '+esc(x.f.titulo)+'</span>'+
        '<span class="t">'+esc(x.c.titulo)+'</span></a>' : '<span></span>';
    return '<nav class="vecinas" aria-label="Otras clases">'+
      enlace(todas[k-1],'‹ Anterior','ant')+enlace(todas[k+1],'Siguiente ›','sig')+'</nav>';
  }

  // "Marcar como vista": el mismo avance que usa el hub
  function activarVista(cursoId, clase){
    const btn = document.getElementById('marcarVista');
    if(!btn || !window.Progreso || !Progreso.disponible()) return;
    const E = Progreso.ESTADOS;
    function pintar(estado){
      const vista = estado === E.VISTO;
      btn.hidden = false;
      btn.setAttribute('aria-pressed', vista ? 'true' : 'false');
      btn.textContent = vista ? '✓ Vista · desmarcar' : 'Marcar como vista';
    }
    Progreso.visto(cursoId, clase.id).then(pintar);
    btn.addEventListener('click', function(){
      const nuevo = btn.getAttribute('aria-pressed') === 'true' ? E.CURSO : E.VISTO;
      Progreso.marcar(cursoId, clase.id, nuevo).then(pintar);
    });
  }

  function pinta(clase, fila, data){
    document.title = clase.titulo + ' — De tu mente al mundo';

    // admite el formato nuevo (lista de generaciones) y el viejo (una sola URL).
    // Las entradas sin url son huecos preparados: aún no cuentan como grabación.
    const grabs = (clase.grabaciones && clase.grabaciones.length
      ? clase.grabaciones
      : (clase.grabacion ? [{url:clase.grabacion}] : [])
    ).filter(g => g && g.url);

    const grabacion = grabs.length
      ? grabs.map((g,i)=>
          '<a class="item" href="repaso.html?id='+encodeURIComponent(clase.id)+
            (i?'&g='+i:'')+'">'+
            '<span class="ico">▶</span>'+
            '<span class="body">'+
              '<span class="t">'+(g.generacion?esc(g.generacion)+' generación':'Video de la sesión')+'</span>'+
              '<span class="d">'+(g.fecha?fechaLarga(g.fecha)+' · ':'')+
                'Se abre junto a la presentación.</span>'+
            '</span>'+
            '<span class="go">Ver →</span></a>').join('')
      : '<span class="item soon">'+
          '<span class="ico">▶</span>'+
          '<span class="body"><span class="t">Video de la sesión</span>'+
          '<span class="d">Se sube después de la clase.</span></span>'+
          '<span class="go">Próximamente</span></span>';

    const recursos = (clase.recursos||[]).map(r=>
      '<a class="item" href="'+esc(r.url)+'">'+
        '<span class="ico">'+esc(r.icono||'⌘')+'</span>'+
        '<span class="body"><span class="t">'+esc(r.titulo)+'</span>'+
        '<span class="d">'+esc(r.descripcion||'')+'</span></span>'+
        '<span class="go">Abrir →</span></a>').join('');

    const temas = (clase.temas||[]).map((t,i)=>
      '<div class="topic"><div class="n">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="tx">'+esc(t)+'</div></div>').join('');

    box.innerHTML =
      '<div class="eyebrow">'+esc(fila.titulo)+' · '+esc(clase.parte)+'</div>'+
      '<h1>'+esc(clase.titulo)+'</h1>'+
      '<p class="lede">'+esc(clase.resumen)+'</p>'+
      '<div class="acciones-clase">'+
      (clase.deck?'<a class="mainact" href="'+esc(clase.deck)+'">Abrir presentación <span class="arw">→</span></a>':'')+
      '<button class="marcar-vista" id="marcarVista" type="button" hidden aria-pressed="false">Marcar como vista</button>'+
      '</div>'+
      '<h2>Grabación</h2><div class="items">'+grabacion+'</div>'+
      (recursos?'<h2>Recursos</h2><div class="items">'+recursos+'</div>':'')+
      (temas?'<h2>Qué vas a ver</h2><div class="topics">'+temas+'</div>':'')+
      vecinas(clase, data)+
      '<p class="foot">De tu mente al mundo · una iniciativa de '+
      '<a href="../index.html">La Red de Luz</a></p>';
  }

  Promise.all([
    fetch('clases.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }),
    fetch('constelacion.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
  ])
    .then(([data, cfg])=>{
      let encontrada=null, suFila=null;
      data.filas.forEach(f=>f.clases.forEach(c=>{
        if(c.id===id){ encontrada=c; suFila=f; }
      }));
      if(!encontrada){
        box.innerHTML='<p class="loaderr">No encontramos esa clase. '+
          '<a href="index.html" style="color:var(--sesame)">Volver al hub</a></p>';
        return;
      }
      pinta(encontrada, suFila, data);
      const home = document.querySelector('.topbar .home');
      if(home){ home.href = 'index.html#curso/'+encodeURIComponent(suFila.id); home.textContent = '‹ '+suFila.titulo; }
      if(cfg && cfg.id) activarVista(cfg.id, encontrada);
    })
    .catch(e=>{
      box.innerHTML='<p class="loaderr">No se pudo cargar la clase. Si abriste el archivo '+
        'directamente, necesitas un servidor local para leer clases.json.</p>';
      console.error('[clase]',e);
    });
})();
</script>
</body>
</html>
