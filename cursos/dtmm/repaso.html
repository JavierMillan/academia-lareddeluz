<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/imgs/reddeluz.png">
<title>Repaso — De tu mente al mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Spline+Sans:wght@300;400;500;600&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/motor/hub.css">
<link rel="stylesheet" href="assets/motor/temas/dtmm.css">
<style>
/* ============================================================
   Modo repaso · el video y la presentación, lado a lado
   ============================================================ */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--char)}

.repaso-bar{display:flex;align-items:center;gap:clamp(.7rem,2vw,1.3rem);flex-shrink:0;
  padding:.7rem clamp(1rem,3vw,2rem);
  background:rgba(25,20,15,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-d);
  position:relative;z-index:10}  /* el panel de recursos queda encima de los paneles */
.repaso-bar .titulo{font-family:'Unbounded',sans-serif;font-weight:500;
  font-size:clamp(.82rem,1.5vw,1rem);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.repaso-bar .volver{font-family:'Martian Mono',monospace;font-size:.66rem;letter-spacing:.12em;
  color:var(--on-char-soft);text-decoration:none;border:1px solid var(--line-d2);
  border-radius:8px;padding:.42rem .8rem;white-space:nowrap;flex-shrink:0;
  transition:.25s var(--ease)}
.repaso-bar .volver:hover{border-color:var(--sesame);color:var(--sesame)}
.repaso-bar .volver:focus-visible{outline:2px solid var(--sesame);outline-offset:2px}

/* selector de generación */
.gens{display:flex;gap:.35rem;flex-shrink:0}
.gens button{font-family:'Martian Mono',monospace;font-size:.6rem;letter-spacing:.1em;
  background:transparent;border:1px solid var(--line-d2);color:var(--on-char-soft);
  border-radius:999px;padding:.35rem .7rem;cursor:pointer;white-space:nowrap;
  transition:.25s var(--ease);touch-action:manipulation}
.gens button:hover{border-color:var(--sesame);color:var(--sesame)}
.gens button[aria-pressed="true"]{background:rgba(232,161,60,.14);
  border-color:var(--sesame);color:var(--sesame)}
.gens button:focus-visible{outline:2px solid var(--sesame);outline-offset:2px}

/* dos paneles; el ancho de cada uno lo mueve el divisor (--izq / --der) */
.panes{flex:1;display:grid;min-height:0;background:var(--char);
  grid-template-columns:minmax(0,var(--izq,1fr)) 9px minmax(0,var(--der,1fr))}

/* divisor arrastrable entre video y presentación */
.divisor{position:relative;cursor:col-resize;touch-action:none;background:var(--char)}
.divisor::before{content:"";position:absolute;inset:0 4px;background:var(--line-d);
  transition:background .2s var(--ease)}
.divisor::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:44px;
  transform:translateY(-50%);border-radius:999px;background:var(--line-d2);
  transition:background .2s var(--ease)}
.divisor:hover::before,.divisor:focus-visible::before,.arrastrando .divisor::before{background:var(--sesame)}
.divisor:hover::after,.divisor:focus-visible::after,.arrastrando .divisor::after{background:var(--sesame)}
.divisor:focus-visible{outline:none}
/* mientras se arrastra, los iframes no se quedan con el puntero */
.arrastrando{cursor:col-resize;user-select:none}
.arrastrando iframe{pointer-events:none}

/* pestañas del panel derecho: Presentación / Recursos */
.vistas{display:flex;gap:.25rem}
.vistas button{font:inherit;letter-spacing:inherit;text-transform:inherit;
  background:transparent;border:0;border-bottom:2px solid transparent;color:var(--on-char-mute);
  padding:.15rem .1rem;margin-right:.7rem;cursor:pointer;transition:.2s var(--ease)}
.vistas button:hover{color:var(--on-char-soft)}
.vistas button[aria-selected="true"]{color:var(--sesame);border-bottom-color:var(--sesame)}
.vistas button:focus-visible{outline:2px solid var(--sesame);outline-offset:3px}
.vista{position:absolute;inset:0}
.vista[hidden]{display:none}
.vista > iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* lista de recursos dentro del panel */
.lista-recursos{position:absolute;inset:0;overflow:auto;
  padding:clamp(1.2rem,3vw,2.4rem);display:flex;flex-direction:column;gap:.6rem}
.lista-recursos[hidden]{display:none}
.lista-recursos .item{display:flex;gap:.9rem;align-items:flex-start;text-decoration:none;
  color:var(--on-char);padding:1rem 1.1rem;border-radius:12px;border:1px solid var(--line-d2);
  background:var(--char-soft);transition:.2s var(--ease);max-width:640px}
.lista-recursos .item:hover{border-color:var(--sesame)}
.lista-recursos .item:focus-visible{outline:2px solid var(--sesame);outline-offset:2px}
.lista-recursos .ico{color:var(--sesame);font-size:1.05rem;line-height:1.3;width:1.3rem;
  flex-shrink:0;text-align:center}
.lista-recursos .t{display:block;font-family:'Unbounded',sans-serif;font-weight:500;
  font-size:.82rem;line-height:1.35}
.lista-recursos .d{display:block;margin-top:.3rem;font-size:.82rem;line-height:1.5;
  color:var(--on-char-soft)}
.lista-recursos .go{margin-left:auto;padding-left:.6rem;flex-shrink:0;font-family:'Martian Mono',monospace;
  font-size:.6rem;letter-spacing:.1em;color:var(--sesame);white-space:nowrap}
/* un recurso abierto dentro del panel */
.recurso-abierto{position:absolute;inset:0;display:flex;flex-direction:column}
.recurso-abierto[hidden]{display:none}
.recurso-abierto .volver-lista{flex-shrink:0;align-self:flex-start;margin:.6rem clamp(.7rem,2vw,1.1rem);
  font-family:'Martian Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line-d2);color:var(--on-char-soft);
  border-radius:8px;padding:.4rem .75rem;cursor:pointer;transition:.2s var(--ease)}
.recurso-abierto .volver-lista:hover{border-color:var(--sesame);color:var(--sesame)}
.recurso-abierto .volver-lista:focus-visible{outline:2px solid var(--sesame);outline-offset:2px}
.recurso-abierto iframe{flex:1;width:100%;border:0;border-top:1px solid var(--line-d)}
.pane{background:var(--char);min-width:0;min-height:0;display:flex;flex-direction:column}
.pane .cab{font-family:'Martian Mono',monospace;font-size:.58rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--on-char-mute);
  padding:.55rem clamp(.7rem,2vw,1.1rem);border-bottom:1px solid var(--line-d);
  display:flex;align-items:center;justify-content:space-between;gap:.7rem;flex-shrink:0}
.pane .cab a{color:var(--sesame);text-decoration:none;letter-spacing:.1em}
.pane .cab a:hover{text-decoration:underline}
.pane .cuerpo{flex:1;min-height:0;position:relative}
/* la presentación sí llena su panel; el video se rige por .video-marco */
.pane .cuerpo > iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* el video mantiene su proporción 16:9 y se centra en el panel.
   El contenedor interno se encoge al 16:9 disponible; el iframe lo llena. */
.video-marco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;container-type:size}
.video-marco iframe{border:0;
  width:min(100%, calc(100cqh * 16 / 9));
  height:min(100%, calc(100cqw * 9 / 16));
  aspect-ratio:16/9}
.video-fallback{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--sesame);text-decoration:none;font-family:'Martian Mono',monospace;
  font-size:.75rem;letter-spacing:.1em}
.video-fallback:hover{text-decoration:underline}

.vacio{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--on-char-mute);font-size:.9rem;text-align:center;padding:2rem;line-height:1.6}

/* clase sin presentación: el video ocupa toda la pantalla */
.panes.solo-video{grid-template-columns:1fr}
.panes.solo-video .pane:last-child,.panes.solo-video .divisor{display:none}
.panes.solo-video .pane.video .cuerpo{flex:1}

/* ---- vertical: el video arriba, la presentación abajo ---- */
@media (max-width:900px), (orientation:portrait){
  .panes{grid-template-columns:1fr;
    /* el video toma lo que necesita para su 16:9; el deck se queda con el resto */
    grid-template-rows:min-content minmax(0,1fr)}
  /* .cuerpo es flex:1 en el layout base; aquí se fija a la altura del 16:9 */
  .pane.video .cuerpo{flex:0 0 min(38vh, 56.25vw);position:relative}
  .video-marco{position:absolute;inset:0}
  /* apilados no hay nada que arrastrar */
  .divisor{display:none}
  .repaso-bar{flex-wrap:wrap}
  .repaso-bar .titulo{order:3;width:100%;white-space:normal;flex-basis:100%;
    font-size:.8rem;line-height:1.3}
}
</style>
</head>
<body class="theme-dtmm">

<div class="repaso-bar">
  <a class="volver" id="volver" href="index.html">‹ Clase</a>
  <div class="titulo" id="titulo">Cargando…</div>
  <div class="gens" id="gens"></div>
</div>

<div class="panes" id="panes">
  <section class="pane video">
    <div class="cab"><span id="cabVideo">Grabación</span></div>
    <div class="cuerpo" id="paneVideo"></div>
  </section>
  <div class="divisor" id="divisor" role="separator" tabindex="0"
    aria-orientation="vertical" aria-label="Ancho del video y la presentación"
    aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"
    title="Arrastra para cambiar el tamaño · doble clic para centrar"></div>
  <section class="pane">
    <div class="cab">
      <div class="vistas" id="vistas" role="tablist"><span>Presentación</span></div>
      <a id="abrirDeck" href="#" target="_blank" rel="noopener">Abrir sola ↗</a></div>
    <div class="cuerpo">
      <div class="vista" id="paneDeck" role="tabpanel"></div>
      <div class="vista" id="paneRecursos" role="tabpanel" hidden>
        <div class="lista-recursos" id="listaRecursos"></div>
        <div class="recurso-abierto" id="recursoAbierto" hidden>
          <button type="button" class="volver-lista" id="volverLista">‹ Recursos</button>
          <iframe id="recursoFrame" title="Recurso de la clase"></iframe>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="assets/video.js"></script>
<script>
(function(){
  'use strict';
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,c=>(
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const params = new URLSearchParams(location.search);
  const id  = params.get('id');
  let   gen = parseInt(params.get('g'),10) || 0;

  fetch('clases.json')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data=>{
      let clase=null, fila=null;
      data.filas.forEach(f=>f.clases.forEach(c=>{ if(c.id===id){clase=c;fila=f;} }));
      if(!clase){
        document.getElementById('titulo').textContent='No encontramos esa clase';
        document.getElementById('paneVideo').innerHTML=
          '<div class="vacio">Revisa el enlace, o <a href="index.html" style="color:var(--sesame)">vuelve al hub</a>.</div>';
        return;
      }

      document.title = clase.titulo + ' · Repaso — De tu mente al mundo';
      document.getElementById('titulo').textContent = clase.titulo;
      document.getElementById('volver').href = 'clase.html?id='+encodeURIComponent(clase.id);

      // el panel derecho alterna entre la presentación y los recursos, sin
      // tocar el video. Si la clase no tiene ninguno de los dos (p.ej. una
      // sesión abierta que solo se grabó), el video se queda con toda la pantalla.
      const recursos = clase.recursos || [];
      const abrirSola = document.getElementById('abrirDeck');
      const vistas = [];
      let recursoUrl = '';   // el recurso abierto en el panel, si hay uno
      if(clase.deck){
        document.getElementById('paneDeck').innerHTML =
          '<iframe src="'+esc(clase.deck)+'" title="Presentación de la clase"></iframe>';
        vistas.push({id:'deck', nombre:'Presentación', panel:'paneDeck'});
      }
      if(recursos.length){
        // las páginas se abren dentro del panel; lo demás (un .zip) se descarga
        const enPanel = r => /\.html?($|[?#])/i.test(r.url||'');
        const lista   = document.getElementById('listaRecursos');
        const abierto = document.getElementById('recursoAbierto');
        const frame   = document.getElementById('recursoFrame');
        lista.innerHTML = recursos.map((r,i)=>
          '<a class="item" href="'+esc(r.url)+'" data-i="'+i+'"'+
            (enPanel(r) ? '' : ' download')+'>'+
            '<span class="ico" aria-hidden="true">'+esc(r.icono||'⌘')+'</span>'+
            '<span><span class="t">'+esc(r.titulo)+'</span>'+
            '<span class="d">'+esc(r.descripcion||'')+'</span></span>'+
            '<span class="go">'+(enPanel(r) ? 'Ver →' : 'Descargar ↓')+'</span></a>').join('');
        lista.addEventListener('click', e=>{
          const a = e.target.closest('a[data-i]');
          if(!a) return;
          const r = recursos[+a.dataset.i];
          if(!enPanel(r)) return;
          e.preventDefault();
          frame.src = r.url;
          frame.title = r.titulo;
          lista.hidden = true; abierto.hidden = false;
          recursoUrl = r.url;
          abrirSola.href = r.url; abrirSola.hidden = false;
        });
        document.getElementById('volverLista').onclick = ()=>{
          abierto.hidden = true; lista.hidden = false;
          recursoUrl = '';
          abrirSola.hidden = true;
        };
        vistas.push({id:'recursos', nombre:'Recursos · '+recursos.length, panel:'paneRecursos'});
      }

      if(!vistas.length){
        document.getElementById('panes').classList.add('solo-video');
      }else{
        const tabs = document.getElementById('vistas');
        tabs.innerHTML = vistas.length > 1
          ? vistas.map(v=>'<button type="button" role="tab" aria-selected="false" '+
              'aria-controls="'+v.panel+'">'+esc(v.nombre)+'</button>').join('')
          : '<span>'+esc(vistas[0].nombre)+'</span>';
        function verVista(n){
          vistas.forEach((v,i)=>{
            document.getElementById(v.panel).hidden = i!==n;
            if(tabs.children[i] && vistas.length>1)
              tabs.children[i].setAttribute('aria-selected', i===n?'true':'false');
          });
          const v = vistas[n];
          const url = v.id==='deck' ? clase.deck : recursoUrl;
          abrirSola.hidden = !url;
          if(url) abrirSola.href = url;
        }
        if(vistas.length > 1) [...tabs.children].forEach((b,i)=>b.onclick=()=>verVista(i));
        verVista(0);
      }

      // grabaciones: formato nuevo o el viejo de una sola URL
      // las entradas sin url son huecos preparados, no grabaciones todavía
      const grabs = ((clase.grabaciones && clase.grabaciones.length)
        ? clase.grabaciones.slice()
        : (clase.grabacion ? [{url:clase.grabacion}] : [])
      ).filter(g => g && g.url);
      // la más reciente primero
      grabs.sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));

      const paneVideo = document.getElementById('paneVideo');
      const cabVideo  = document.getElementById('cabVideo');
      const gens      = document.getElementById('gens');

      if(!grabs.length){
        paneVideo.innerHTML =
          '<div class="vacio">La grabación de esta clase se sube después de la sesión.</div>';
        return;
      }

      function mostrar(n){
        gen = Math.max(0, Math.min(grabs.length-1, n));
        const g = grabs[gen];
        paneVideo.innerHTML = window.DTMMVideo.reproductor(g.url, clase.titulo);
        cabVideo.textContent = g.generacion ? g.generacion+' generación' : 'Grabación';
        [...gens.children].forEach((b,i)=>b.setAttribute('aria-pressed', i===gen?'true':'false'));
        const u = new URL(location);
        if(gen) u.searchParams.set('g',gen); else u.searchParams.delete('g');
        try{ history.replaceState(null,'',u); }catch(e){}
      }

      // selector solo si hay más de una generación
      if(grabs.length > 1){
        gens.innerHTML = grabs.map((g,i)=>
          '<button type="button" aria-pressed="false">'+
          esc(g.generacion || ('Video '+(i+1)))+'</button>').join('');
        [...gens.children].forEach((b,i)=>b.onclick=()=>mostrar(i));
      }

      mostrar(gen);
    })
    .catch(e=>{
      document.getElementById('paneVideo').innerHTML =
        '<div class="vacio">No se pudo cargar la clase.</div>';
      console.error('[repaso]',e);
    });
})();

// divisor: arrastra para repartir el ancho entre video y presentación
(function(){
  'use strict';
  const panes = document.getElementById('panes');
  const div   = document.getElementById('divisor');
  const MIN = 25, MAX = 75, CLAVE = 'repaso-division';

  function poner(p){
    p = Math.round(Math.max(MIN, Math.min(MAX, p)));
    panes.style.setProperty('--izq', p+'fr');
    panes.style.setProperty('--der', (100-p)+'fr');
    div.setAttribute('aria-valuenow', p);
    return p;
  }
  let actual = 50;
  try{ actual = parseFloat(localStorage.getItem(CLAVE)) || 50; }catch(e){}
  actual = poner(actual);
  function guardar(){ try{ localStorage.setItem(CLAVE, actual); }catch(e){} }

  div.addEventListener('pointerdown', e=>{
    e.preventDefault();
    div.setPointerCapture(e.pointerId);
    panes.classList.add('arrastrando');
    const caja = panes.getBoundingClientRect();
    const mover = ev => { actual = poner((ev.clientX - caja.left) / caja.width * 100); };
    const soltar = () => {
      panes.classList.remove('arrastrando');
      div.removeEventListener('pointermove', mover);
      div.removeEventListener('pointerup', soltar);
      div.removeEventListener('pointercancel', soltar);
      guardar();
    };
    div.addEventListener('pointermove', mover);
    div.addEventListener('pointerup', soltar);
    div.addEventListener('pointercancel', soltar);
  });
  div.addEventListener('dblclick', ()=>{ actual = poner(50); guardar(); });
  div.addEventListener('keydown', e=>{
    const paso = {ArrowLeft:-5, ArrowRight:5}[e.key];
    if(paso){ e.preventDefault(); actual = poner(actual+paso); guardar(); }
    else if(e.key==='Home'){ e.preventDefault(); actual = poner(50); guardar(); }
  });
})();
</script>
</body>
</html>
